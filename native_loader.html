<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Native Web Loader Prototype</title>
  <style>
    @font-face {
      font-family: 'YekanBakh';
      src: url('panel/fonts/YekanBakhFaNum-Regular.woff2');
    }
    body {
      margin: 0; padding: 0; background: #020713; overflow: hidden; color: white;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    
    #web-loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #06182e 0%, #01040a 100%);
      perspective: 1200px;
    }

    /* 3D Scene */
    .scene {
      position: relative; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      transform-style: preserve-3d;
    }

    /* Holographic Wireframe Sphere */
    .hologram-grid {
      position: absolute; width: 300px; height: 300px;
      border: 1px dashed rgba(182,255,0,0.3); border-radius: 50%;
      animation: pulse-ring 3s infinite alternate;
      box-sizing: border-box;
    }
    .hologram-grid::before {
      content:''; position:absolute; inset: 15px; border: 1px solid rgba(182,255,0,0.1); border-radius: 50%;
    }
    @keyframes pulse-ring { 
      0% { transform: scale(1); opacity: 0.6; } 
      100% { transform: scale(1.05); opacity: 0.9; } 
    }

    /* Center Giant Tennis Ball (Pure CSS) */
    .core-ball {
      position: absolute;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d4ff4d 0%, #a2e600 40%, #5c8000 70%, #1a2400 100%);
      box-shadow: 0 0 60px rgba(182, 255, 0, 0.4), inset -20px -20px 50px rgba(0,0,0,0.6);
      z-index: 10;
      overflow: hidden;
    }
    /* Tennis ball lines */
    .core-ball::before, .core-ball::after {
      content: ''; position: absolute;
      width: 200px; height: 200px;
      border-radius: 50%; border: 8px solid rgba(255,255,255,0.7);
      filter: blur(1.5px);
    }
    .core-ball::before { top: -110px; left: -110px; }
    .core-ball::after { bottom: -110px; right: -110px; }

    /* The SILVERIOM Text over the ball */
    .core-text {
      position: absolute; z-index: 20;
      font-size: 2.5rem; font-weight: 900; letter-spacing: 5px;
      color: #fff; text-shadow: 0 0 15px rgba(255,255,255,0.8), 0 0 30px #B6FF00;
    }

    /* Orbit Rings */
    .orbit {
      position: absolute; border-radius: 50%;
      border: 1px solid rgba(182, 255, 0, 0.4);
      transform-style: preserve-3d;
      box-shadow: 0 0 20px rgba(182, 255, 0, 0.1) inset;
    }
    .orbit-1 { width: 500px; height: 500px; border-style: dashed; animation: spin-3d 10s linear infinite; }
    .orbit-2 { width: 700px; height: 700px; animation: spin-3d-rev 15s linear infinite; }
    .orbit-3 { width: 950px; height: 950px; border: 2px solid rgba(182, 255, 0, 0.15); animation: spin-3d 25s linear infinite; }

    /* Small Planets (CSS Tennis balls) */
    .planet {
      position: absolute; top: -12px; left: 50%; margin-left: -12px;
      width: 24px; height: 24px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #e6ff80, #99cc00);
      box-shadow: 0 0 15px #B6FF00, 0 0 30px rgba(182,255,0,0.8);
      transform: rotateX(-75deg); /* Counter the orbit's 3D tilt */
    }
    
    /* Position the planets on the orbits */
    .orbit-1 .planet { top: -12px; left: 50%; }
    .orbit-2 .planet { top: 50%; left: -12px; transform: rotateY(90deg) rotateX(-75deg); }
    .orbit-3 .planet { bottom: -12px; left: 50%; top: auto; transform: rotateX(-75deg); }
    .orbit-3 .planet.p2 { bottom: auto; top: 50%; left: auto; right: -12px; transform: rotateY(-90deg) rotateX(-75deg); }

    @keyframes spin-3d {
      from { transform: rotateX(75deg) rotateZ(0deg); }
      to { transform: rotateX(75deg) rotateZ(360deg); }
    }
    @keyframes spin-3d-rev {
      from { transform: rotateX(75deg) rotateZ(360deg); }
      to { transform: rotateX(75deg) rotateZ(0deg); }
    }

    /* UI OVERLAY (The Dashboard) */
    .ui-overlay {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 40px; z-index: 50;
    }
    .ui-header { display: flex; justify-content: space-between; align-items: flex-start; }
    
    .ui-box {
      border: 1px solid rgba(182, 255, 0, 0.3); background: rgba(0,2,10,0.6);
      padding: 10px 15px; font-size: 0.75rem; color: #B6FF00; letter-spacing: 2px;
      backdrop-filter: blur(5px); line-height: 1.6;
    }

    .loader-bar-container {
      position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; justify-content: center; gap: 20px; width: 80%; max-width: 600px;
    }
    .loader-label { color: rgba(255,255,255,0.5); font-size: 0.7rem; letter-spacing: 2px; white-space: nowrap; }
    
    .loading-center { display: flex; flex-direction: column; flex-grow: 1; align-items: center; gap: 8px; }
    .loading-text { color: #fff; font-weight: bold; font-size: 1.4rem; letter-spacing: 8px; text-shadow: 0 0 10px rgba(182,255,0,0.5); }
    
    .progress-track { width: 100%; height: 4px; background: rgba(255,255,255,0.1); position: relative; overflow: hidden; border-radius: 2px; }
    .progress-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: #B6FF00; box-shadow: 0 0 10px #B6FF00; animation: fill-bar 3s cubic-bezier(0.4, 0, 0.2, 1) forwards infinite; }

    @keyframes fill-bar { 0% { width: 0%; } 100% { width: 100%; } }

    /* HUD Corners */
    .hud-corner { position: absolute; width: 30px; height: 30px; border: 2px solid rgba(182,255,0,0.6); }
    .hud-tl { top: 30px; left: 30px; border-right: none; border-bottom: none; }
    .hud-tr { top: 30px; right: 30px; border-left: none; border-bottom: none; }
    .hud-bl { bottom: 30px; left: 30px; border-right: none; border-top: none; }
    .hud-br { bottom: 30px; right: 30px; border-left: none; border-top: none; }

    @media (max-width: 768px) {
      .core-ball { width: 160px; height: 160px; }
      .core-ball::before, .core-ball::after { width: 120px; height: 120px; }
      .core-ball::before { top: -60px; left: -60px; }
      .core-ball::after { bottom: -60px; right: -60px; }
      .hologram-grid { width: 180px; height: 180px; }
      .core-text { font-size: 1.5rem; }
      .orbit-1 { width: 280px; height: 280px; }
      .orbit-2 { width: 400px; height: 400px; }
      .orbit-3 { width: 550px; height: 550px; }
      .loader-bar-container { width: 90%; bottom: 40px; flex-direction: column; gap: 15px;}
      .ui-box { display: none; }
    }
  </style>




<!-- SILVERIOM MINIMAL LOADER STYLE -->
<style>
  #minimal-loader {
    position: fixed; inset: 0; z-index: 9999999;
    background-color: #030712; /* Deep premium dark */
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.6s ease, visibility 0.6s ease;
  }
  .ml-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
  
  .ml-brand {
    color: #ffffff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 1.2rem; font-weight: 300; letter-spacing: 10px;
    text-transform: uppercase; margin-bottom: 25px; margin-left: 10px; /* offset for letter spacing */
    opacity: 0; animation: ml-fade-in 0.8s ease forwards, ml-pulse 2s 0.8s infinite alternate;
  }
  @keyframes ml-fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 0.9; transform: translateY(0); } }
  @keyframes ml-pulse { 0% { opacity: 0.5; } 100% { opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,0.2); } }

  .ml-progress-container {
    width: 180px; height: 1px; background: rgba(255,255,255,0.1);
    overflow: hidden;
  }
  .ml-progress-bar {
    width: 0%; height: 100%; background: #B6FF00; /* Silveriom Neon Green */
    box-shadow: 0 0 10px #B6FF00;
    animation: ml-fill 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards;
  }
  @keyframes ml-fill { 0% { width: 0%; } 100% { width: 100%; } }
  .ml-percent {
    color: #B6FF00; font-family: 'Helvetica Neue', Arial, sans-serif !important; direction: ltr;
    font-size: 1.1rem; font-weight: 700; margin-top: 15px; letter-spacing: 2px;
    opacity: 0; animation: ml-fade-in 0.5s ease forwards 0.3s;
  }
</style>

</head>
<body>

<!-- SILVERIOM MINIMAL LOADER DOM & JS -->
<div id="minimal-loader">
  <div class="ml-brand" style="margin-bottom: 5px; opacity:1; animation: none;">
    <img src="https://silveriom.ir/assets/neon_logo.png" alt="Silveriom" style="max-height: 80px; filter: drop-shadow(0 0 15px rgba(182,255,0,0.5));">
  </div>
  <div class="ml-percent" id="ml-percent">0%</div>
  <div class="ml-progress-container"><div class="ml-progress-bar"></div></div>
</div>
<script>
  (function() {
    
    const pct = document.getElementById('ml-percent');
    if (pct) {
      let p = 0;
      const interval = setInterval(() => {
        p += Math.floor(Math.random() * 8) + 4;
        if(p >= 100) { p = 100; clearInterval(interval); }
        pct.innerText = p + '%';
      }, 50);
    }

    const hide = () => { const l = document.getElementById('minimal-loader'); if(l) l.classList.add('ml-hidden'); };
    setTimeout(hide, 1400);
    window.addEventListener('load', () => { setTimeout(hide, 1400); });
    document.addEventListener('DOMContentLoaded', () => {
      document.body.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (!a) return;
        const href = a.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript') && !href.startsWith('tel:') && !href.startsWith('mailto:') && a.target !== '_blank') {
          const isInternal = href.startsWith('/') || href.includes('silveriom.ir') || !href.startsWith('http');
          if (isInternal) {
            e.preventDefault();
            const l = document.getElementById('minimal-loader');
            if(l) {
              l.classList.remove('ml-hidden');
              const fill = l.querySelector('.ml-progress-bar');
              if(fill) {
                fill.style.animation = 'none';
                fill.offsetHeight; 
                fill.style.animation = 'ml-fill 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards';
              }
              document.body.appendChild(l);
            }
            setTimeout(() => { window.location.href = href; }, 1300);
          }
        }
      });
    });
  })();
</script>




  <div id="web-loader">
    <div class="hud-corner hud-tl"></div>
    <div class="hud-corner hud-tr"></div>
    <div class="hud-corner hud-bl"></div>
    <div class="hud-corner hud-br"></div>

    <div class="ui-overlay">
      <div class="ui-header">
        <div class="ui-box" style="border-left: 3px solid #B6FF00;">SPORTS AGENCY<br>SYSTEM INITIALIZATION</div>
        <div class="ui-box" style="border-right: 3px solid #B6FF00; text-align: right;">GLOBAL NETWORK<br>SECURE CONNECTION</div>
      </div>
    </div>

    <div class="scene">
      <div class="orbit orbit-3">
        <div class="planet"></div>
        <div class="planet p2"></div>
      </div>
      <div class="orbit orbit-2"><div class="planet"></div></div>
      <div class="orbit orbit-1"><div class="planet"></div></div>
      
      <div class="hologram-grid"></div>
      <div class="core-ball"></div>
      <div class="core-text">SILVERIOM</div>
    </div>

    <div class="loader-bar-container">
      <div class="loader-label">SPORTS AGENCY</div>
      <div class="loading-center">
         <div class="loading-text">LOADING</div>
         <div class="progress-track"><div class="progress-fill"></div></div>
      </div>
      <div class="loader-label">GLOBAL NETWORK</div>
    </div>

  </div>
</body>
</html>
