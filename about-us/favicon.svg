<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for dark mode presentation (optional) -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background (Dark Mode Pitch Black) -->
  <rect width="512" height="512" rx="96" fill="#000000"/>

  <g transform="translate(0, 0)">
    <!-- Silver Arc (Top Left Arc) -->
    <!-- Center (256, 256), Radius ~155, Start Angle ~22deg, End Angle ~222deg -->
    <path d="M 400 198 A 155 155 0 1 0 142 361" 
          fill="none" 
          stroke="url(#silverGrad)" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- Neon Lime Green Arc (Bottom Right Arc) -->
    <!-- Center (256, 256), Radius ~155, Start Angle ~308deg to ~355deg -->
    <path d="M 235 410 A 155 155 0 0 0 411 256" 
          fill="none" 
          stroke="#BCE500" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- Diagonal Silver Line (Bottom-Left to Top-Right) -->
    <line x1="140" y1="372" x2="350" y2="162" 
          stroke="url(#silverGrad)" 
          stroke-width="16" 
          stroke-linecap="round" />

    <!-- Top-Right Neon Lime Green Dot -->
    <circle cx="372" cy="140" r="32" fill="#BCE500" />
  </g>
</svg>
