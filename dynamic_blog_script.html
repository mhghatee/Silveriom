<div id="dynamic-blog-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; margin-bottom: 80px;">
  <!-- Loading skeleton or empty state -->
  <div style="color:#94a3b8; text-align:center; grid-column:1/-1;">در حال بارگذاری مقالات...</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
    const grid = document.getElementById('dynamic-blog-grid');
    try {
        const res = await fetch('/data/silveriom_db.json?t=' + Date.now());
        const db = await res.json();
        const blogs = db.blogs || [];
        
        if (blogs.length === 0) {
            grid.innerHTML = '<div style="color:#94a3b8; text-align:center; grid-column:1/-1;">هیچ مقاله‌ای یافت نشد.</div>';
            return;
        }

        grid.innerHTML = '';
        blogs.forEach(blog => {
            const imgSrc = blog.image ? (blog.image.startsWith('http') ? blog.image : '../' + blog.image) : '';
            grid.innerHTML += `
            <div class="glass-card blog-card" onclick="window.location.href='post.html?id=${blog.id}'" style="border-radius: 24px; background: rgba(11, 19, 38, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; cursor: pointer;" onmouseover="this.style.transform='translateY(-10px)'; this.style.borderColor='rgba(0,240,255,0.4)'; this.style.boxShadow='0 20px 40px rgba(0,0,0,0.5)';" onmouseout="this.style.transform='translateY(0)'; this.style.borderColor='rgba(255,255,255,0.1)'; this.style.boxShadow='none';">
                <div style="height: 220px; overflow: hidden; position: relative;">
                  <img src="${imgSrc}" alt="${blog.title}" style="width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" loading="lazy">
                  <div style="position: absolute; top: 16px; right: 16px; background: rgba(0, 0, 0, 0.7); border: 1px solid #00F0FF; color: #00F0FF; padding: 5px 12px; border-radius: 12px; font-size: 12px; font-weight: 700; backdrop-filter: blur(4px);">${blog.category || 'مقاله'}</div>
                </div>
                <div style="padding: 24px; display:flex; flex-direction:column; height: 100%;">
                  <div style="color: #94A3B8; font-size: 13px; margin-bottom: 10px;">${blog.date || ''}</div>
                  <h3 style="font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 12px; line-height: 1.5;">${blog.title || ''}</h3>
                  <p style="color: #CBD5E1; font-size: 14px; line-height: 1.7; margin-bottom: 20px; flex-grow:1;">${blog.summary || ''}</p>
                  <div style="color: #00F0FF; font-weight: 700; font-size: 14px;">مطالعه مقاله <i data-lucide="arrow-up-right" style="width: 1.2em; height: 1.2em; vertical-align: text-bottom; display: inline-block;"></i></div>
                </div>
            </div>
            `;
        });
        if (typeof lucide !== "undefined") lucide.createIcons();
    } catch (e) {
        console.error(e);
        grid.innerHTML = '<div style="color:#ff4444; text-align:center; grid-column:1/-1;">خطا در بارگذاری مقالات.</div>';
    }
});
</script>
