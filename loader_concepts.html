<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پیش‌نمایش ایده‌های لودینگ سیلوریوم</title>
  <style>
    @font-face {
      font-family: 'YekanBakh';
      src: url('panel/fonts/YekanBakhFaNum-Regular.woff2') format('woff2');
    }
    body { 
      margin: 0; background: #010610; color: white; 
      font-family: 'YekanBakh', Tahoma, sans-serif; 
      overflow: hidden; 
    }
    
    .tabs-container {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 100;
      background: rgba(2, 6, 18, 0.8); backdrop-filter: blur(10px);
      padding: 10px; border-radius: 50px; border: 1px solid rgba(182, 255, 0, 0.2);
    }
    .tab { 
      padding: 12px 20px; background: transparent; 
      color: rgba(255,255,255,0.7); border-radius: 30px; 
      cursor: pointer; font-size: 0.85rem; font-weight: bold;
      transition: all 0.3s; text-align: center; white-space: nowrap;
    }
    .tab.active { 
      background: #B6FF00; color: #010610; 
      box-shadow: 0 0 15px rgba(182, 255, 0, 0.4); 
    }
    .concept { 
      display: none; position: absolute; inset: 0; 
      align-items: center; justify-content: center; 
      width: 100vw; height: 100vh;
      background: radial-gradient(ellipse at center, #0a2d52 0%, #030e1f 60%, #000308 100%);
    }
    .concept.active { display: flex; }

    /* =========================================
       CONCEPT 1: Quantum Data Core 
       ========================================= */
    .q-container { position: relative; display: flex; align-items: center; justify-content: center; }
    .q-core-text { 
      position: absolute; z-index: 10; color: #B6FF00; 
      font-weight: 900; letter-spacing: 3px; font-size: 1.2rem;
      text-shadow: 0 0 15px rgba(182,255,0,0.8);
      animation: q-pulse 1.5s infinite alternate;
    }
    .q-ring-1 { 
      position: absolute; width: 140px; height: 140px; 
      border: 2px dashed rgba(182, 255, 0, 0.8); border-radius: 50%; 
      animation: spin 8s linear infinite; 
    }
    .q-ring-2 { 
      position: absolute; width: 220px; height: 220px; 
      border: 1px dotted rgba(255, 255, 255, 0.4); border-radius: 50%; 
      animation: spinRev 12s linear infinite; 
    }
    .q-ring-3 { 
      position: absolute; width: 320px; height: 320px; 
      border: 1px dashed rgba(182, 255, 0, 0.2); border-radius: 50%; 
      animation: spin 20s linear infinite; 
    }
    .q-node { 
      position: absolute; width: 10px; height: 10px; 
      background: #fff; border-radius: 50%; 
      box-shadow: 0 0 15px #fff, 0 0 30px #B6FF00; 
    }
    .q-ring-1 .q-node { top: -6px; left: 50%; transform: translateX(-50%); }
    .q-ring-2 .q-node { bottom: -5px; left: 20%; background: #B6FF00; }
    .q-ring-3 .q-node { top: 50%; right: -5px; transform: translateY(-50%); }

    /* =========================================
       CONCEPT 2: Neon Eclipse (Cinematic)
       ========================================= */
    .e-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; perspective: 1000px; background: #000; }
    .e-sun { 
      width: 140px; height: 140px; background: #000; border-radius: 50%; 
      box-shadow: 0 0 80px 20px #B6FF00, inset 0 0 20px rgba(0,0,0,1); 
      z-index: 10; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .e-text { 
      color: #fff; font-weight: 900; z-index: 11; letter-spacing: 4px; font-size: 1.1rem;
      opacity: 0.8;
    }
    .e-orbit-1 { 
      position: absolute; width: 340px; height: 340px; 
      border-radius: 50%; border: 1px solid rgba(255,255,255,0.05);
      transform-style: preserve-3d; transform: rotateX(65deg);
      animation: e-spin3d 6s linear infinite; z-index: 5;
    }
    .e-orbit-2 { 
      position: absolute; width: 480px; height: 480px; 
      border-radius: 50%; border: 1px solid rgba(182,255,0,0.1);
      transform-style: preserve-3d; transform: rotateX(75deg) rotateY(20deg);
      animation: e-spin3dRev 10s linear infinite; z-index: 15;
    }
    .e-planet-silver { 
      position: absolute; top: -12px; left: 50%; width: 24px; height: 24px; 
      background: radial-gradient(circle at 30% 30%, #fff, #888); 
      border-radius: 50%; box-shadow: 0 0 20px rgba(255,255,255,0.8); 
      transform: translateX(-50%) rotateX(-90deg); 
    }
    .e-planet-neon { 
      position: absolute; bottom: -8px; left: 50%; width: 16px; height: 16px; 
      background: #B6FF00; border-radius: 50%; 
      box-shadow: 0 0 20px #B6FF00; transform: translateX(-50%) rotateX(-90deg); 
    }
    @keyframes e-spin3d { 100% { transform: rotateX(65deg) rotateZ(360deg); } }
    @keyframes e-spin3dRev { 100% { transform: rotateX(75deg) rotateY(20deg) rotateZ(-360deg); } }

    /* =========================================
       CONCEPT 3: Gravitational Ripples
       ========================================= */
    .r-container { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    /* Simulated glassmorphism bg */
    .r-bg { position: absolute; inset: 0; background: url('https://silveriom.ir/assets/silveriom_logo_transparent.png') center/30% no-repeat; filter: blur(30px) opacity(0.2); }
    
    .r-sun { 
      width: 120px; height: 120px; 
      background: radial-gradient(circle, #B6FF00 0%, #76B800 60%, transparent 100%); 
      border-radius: 50%; box-shadow: 0 0 60px rgba(182,255,0,0.6); 
      animation: r-pulse 2s infinite cubic-bezier(0.4, 0, 0.2, 1); 
      display: flex; align-items: center; justify-content: center; 
      z-index: 10; color: #010610; font-weight: 900; letter-spacing: 2px; font-size: 1.1rem;
    }
    .r-ripple-wrapper { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 1;}
    .r-ripple { 
      position: absolute; border: 2px solid #B6FF00; border-radius: 50%; 
      animation: r-wave 3s infinite cubic-bezier(0.1, 0.5, 0.8, 1); opacity: 0; 
    }
    .r-ripple:nth-child(2) { animation-delay: 1s; }
    .r-ripple:nth-child(3) { animation-delay: 2s; }
    
    /* Planet riding the ripple */
    .r-planet-rider {
      position: absolute; width: 16px; height: 16px; background: #fff; 
      border-radius: 50%; box-shadow: 0 0 15px #fff;
      animation: r-ride 3s infinite cubic-bezier(0.1, 0.5, 0.8, 1);
    }
    .r-ripple:nth-child(2) .r-planet-rider { background: #B6FF00; box-shadow: 0 0 15px #B6FF00; animation-delay: 1s; left: 20%; top: 20%;}
    .r-ripple:nth-child(3) .r-planet-rider { display: none; } /* keep it clean */

    @keyframes r-pulse { 
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px rgba(182,255,0,0.4); } 
      50% { transform: scale(1.1); box-shadow: 0 0 90px rgba(182,255,0,0.8); } 
    }
    @keyframes r-wave { 
      0% { width: 100px; height: 100px; opacity: 1; border-width: 4px; transform: rotate(0deg);} 
      100% { width: 600px; height: 600px; opacity: 0; border-width: 1px; transform: rotate(180deg);} 
    }
    @keyframes r-ride {
      0% { transform: translate(50px, 0); opacity: 1; }
      100% { transform: translate(300px, 0); opacity: 0; }
    }

    /* Helpers */
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spinRev { 100% { transform: rotate(-360deg); } }
    @keyframes q-pulse { from { opacity: 0.6; } to { opacity: 1; } }
    
    @media (max-width: 600px) {
      .tabs-container { width: 90%; justify-content: center; flex-wrap: wrap; bottom: 20px;}
      .tab { font-size: 0.75rem; padding: 10px 15px; }
    }
  </style>




<!-- CYBER TENNIS SOLAR LOADER STYLE -->
<style>
  #silveriom-loader {
    position: fixed; inset: 0; z-index: 9999999;
    background: #010610 url('https://silveriom.ir/assets/solar_loader.jpg') center/cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    transition: opacity 0.6s ease, visibility 0.6s ease;
    overflow: hidden;
  }
  .sl-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }
  
  /* Dynamic Progress Bar aligned with UI in image */
  .cl-progress-wrapper {
    position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
    width: 25%; max-width: 320px; height: 6px;
    background: rgba(255,255,255,0.1); border-radius: 10px;
    overflow: hidden;
  }
  .cl-progress-fill {
    height: 100%; width: 0%; background: #B6FF00;
    box-shadow: 0 0 10px #B6FF00;
    animation: cl-fill 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes cl-fill { 0% { width: 0%; } 100% { width: 100%; } }

  /* Dynamic Moving Balls Overlay */
  .cl-orbit {
    position: absolute; top: 50%; left: 50%;
    border-radius: 50%; border: 1px solid transparent;
    transform: translate(-50%, -50%);
  }
  .cl-orbit-1 { width: 45vw; height: 45vw; animation: cl-spin 4s linear infinite; }
  .cl-orbit-2 { width: 65vw; height: 65vw; animation: cl-spinRev 7s linear infinite; }
  
  .cl-ball {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 18px; border-radius: 50%;
    background: #B6FF00;
    box-shadow: 0 0 20px #B6FF00, -15px 0 25px rgba(182,255,0,0.9);
  }
  .cl-orbit-2 .cl-ball { bottom: -8px; top: auto; box-shadow: 0 0 20px #B6FF00, 15px 0 25px rgba(182,255,0,0.9); }

  @keyframes cl-spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
  @keyframes cl-spinRev { 0% { transform: translate(-50%, -50%) rotate(360deg); } 100% { transform: translate(-50%, -50%) rotate(0deg); } }

  @media (max-width: 768px) {
    .cl-progress-wrapper { width: 50%; bottom: 9.5%; }
    .cl-orbit-1 { width: 80vw; height: 80vw; }
    .cl-orbit-2 { width: 120vw; height: 120vw; }
    #silveriom-loader { background-position: center; }
  }
</style>

</head>
<body>

<!-- CYBER TENNIS SOLAR LOADER DOM & JS -->
<div id="silveriom-loader">
  <div class="cl-orbit cl-orbit-1"><div class="cl-ball"></div></div>
  <div class="cl-orbit cl-orbit-2"><div class="cl-ball"></div></div>
  <div class="cl-progress-wrapper"><div class="cl-progress-fill"></div></div>
</div>
<script>
  (function() {
    const hideLoader = () => {
      const l = document.getElementById('silveriom-loader');
      if(l) l.classList.add('sl-hidden');
    };
    
    // Hide exactly when progress bar animation finishes (2.5s) + slight buffer
    setTimeout(hideLoader, 2700);
    window.addEventListener('load', () => { setTimeout(hideLoader, 2700); });

    document.addEventListener('DOMContentLoaded', () => {
      document.body.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if (!a) return;
        const href = a.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript') && !href.startsWith('tel:') && !href.startsWith('mailto:') && a.target !== '_blank') {
          const isInternal = href.startsWith('/') || href.includes('silveriom.ir') || !href.startsWith('http');
          if (isInternal) {
            e.preventDefault();
            const l = document.getElementById('silveriom-loader');
            if(l) {
              l.classList.remove('sl-hidden');
              const fill = l.querySelector('.cl-progress-fill');
              if(fill) {
                fill.style.animation = 'none';
                fill.offsetHeight; /* trigger reflow */
                fill.style.animation = 'cl-fill 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards';
              }
              document.body.appendChild(l);
            }
            setTimeout(() => { window.location.href = href; }, 2600);
          }
        }
      });
    });
  })();
</script>




  
  <div id="c1" class="concept active">
    <div class="q-container">
      <div class="q-ring-3"><div class="q-node"></div></div>
      <div class="q-ring-2"><div class="q-node"></div></div>
      <div class="q-ring-1"><div class="q-node"></div></div>
      <div class="q-core-text">SILVERIOM</div>
    </div>
  </div>
  
  <div id="c2" class="concept">
    <div class="e-container">
      <div class="e-orbit-2"><div class="e-planet-neon"></div></div>
      <div class="e-orbit-1"><div class="e-planet-silver"></div></div>
      <div class="e-sun"><div class="e-text">SILVERIOM</div></div>
    </div>
  </div>

  <div id="c3" class="concept">
    <div class="r-container">
      <div class="r-bg"></div>
      <div class="r-ripple-wrapper">
        <div class="r-ripple"><div class="r-planet-rider" style="top: 10%; left: 80%;"></div></div>
        <div class="r-ripple"><div class="r-planet-rider" style="top: 70%; left: 15%;"></div></div>
        <div class="r-ripple"></div>
      </div>
      <div class="r-sun">SILVERIOM</div>
    </div>
  </div>

  <div class="tabs-container">
    <div class="tab active" onclick="show(1)">۱. هسته کوانتومی</div>
    <div class="tab" onclick="show(2)">۲. خورشیدگرفتگی</div>
    <div class="tab" onclick="show(3)">۳. فضای سیال</div>
  </div>

  <script>
    function show(n) {
      document.querySelectorAll('.concept').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('c' + n).classList.add('active');
      document.querySelectorAll('.tab')[n-1].classList.add('active');
    }
  </script>
</body>
</html>
