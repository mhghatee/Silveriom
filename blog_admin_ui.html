      <!-- TAB 5: BLOG CMS -->
      <!-- ========================================== -->
      <div id="tab-blog" class="tab-content" style="padding: 20px; max-width: 1200px; margin: 0 auto; height:100%; overflow-y:auto; padding-bottom:100px;">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:20px;">
            <h2 class="section-title" style="margin:0;"><i data-lucide="newspaper"></i> مدیریت بلاگ‌ها</h2>
            <button class="luxury-btn-outline" onclick="openBlogModal()">
                <i data-lucide="plus"></i> افزودن مقاله جدید
            </button>
        </div>
        
        <div class="glass-grid" id="blogs-list" style="grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));">
            <!-- Blog cards will be rendered here -->
        </div>

        <!-- BLOG MODAL -->
        <div id="blog-modal" class="modal-overlay" style="display:none; z-index:999999;">
            <div class="modal-content glass-card" style="max-width: 800px; width:90%; max-height:90vh; overflow-y:auto; padding:30px;">
                <h3 id="blog-modal-title" style="color:#ccff00; margin-bottom:20px; font-weight:800;">افزودن مقاله</h3>
                <input type="hidden" id="blog-id">
                
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
                    <div>
                        <label class="form-label">عنوان مقاله</label>
                        <input type="text" id="blog-title" class="form-input" placeholder="مثلاً: انقلاب نئونی در کورت‌های پدل">
                    </div>
                    <div>
                        <label class="form-label">دسته‌بندی (Badge)</label>
                        <input type="text" id="blog-category" class="form-input" placeholder="مثلاً: اخبار کلاب‌ها">
                    </div>
                    <div>
                        <label class="form-label">تاریخ انتشار</label>
                        <input type="text" id="blog-date" class="form-input" placeholder="مثلاً: ۱۵ شهریور ۱۴۰۵">
                    </div>
                    <div>
                        <label class="form-label">تصویر کاور (لینک یا آپلود)</label>
                        <div style="display:flex; gap:10px;">
                            <input type="text" id="blog-image" class="form-input" placeholder="لینک تصویر...">
                            <label class="luxury-btn-outline" style="padding:10px; cursor:pointer; min-width:max-content;">
                                <i data-lucide="upload"></i> آپلود
                                <input type="file" accept="image/*" style="display:none;" onchange="uploadBlogImage(this)">
                            </label>
                        </div>
                    </div>
                </div>

                <div style="margin-bottom:20px;">
                    <label class="form-label">خلاصه مقاله (توضیح کوتاه روی کارت)</label>
                    <textarea id="blog-summary" class="form-input" rows="2" placeholder="چکیده مقاله..."></textarea>
                </div>

                <div style="margin-bottom:20px;">
                    <label class="form-label">محتوای کامل مقاله (می‌توانید از تگ‌های HTML استفاده کنید)</label>
                    <textarea id="blog-content" class="form-input" rows="8" placeholder="<p>متن اصلی مقاله...</p>" style="font-family: monospace; direction: ltr; text-align: left;"></textarea>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:15px; margin-top:30px;">
                    <button class="luxury-btn-outline" style="border-color:#ff4444; color:#ff4444;" onclick="closeBlogModal()">انصراف</button>
                    <button class="luxury-btn-outline" style="background:#ccff00; color:#000;" onclick="saveBlog()">ذخیره مقاله</button>
                </div>
            </div>
        </div>
      </div>
