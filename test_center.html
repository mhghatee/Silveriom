<!DOCTYPE html>
<html dir="rtl">
<head>
<style>
.container {
  position: relative;
  width: 1000px;
  height: 100px;
  background: #ccc;
  margin: 0 auto;
}
.center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: red;
  width: 200px;
  height: 50px;
}
</style>
<style>.top-complex-bar { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; z-index: 9999999 !important; display: flex !important; opacity: 1 !important; visibility: visible !important; margin: 0 !important; transform: none !important; } #silverium-loader { top: 50px !important; height: calc(100vh - 50px) !important; } @media (max-width: 1024px) { #silverium-loader { top: 40px !important; height: calc(100vh - 40px) !important; } }</style>


<style id="fix-mega-menu-visibility">
  header#main-nav.luxury-nav {
    z-index: 9000 !important;
  }
  header#main-nav.luxury-nav,
  header#main-nav.luxury-nav .nav-container,
  header#main-nav.luxury-nav .nav-links,
  header#main-nav.luxury-nav .nav-wrapper {
    overflow: visible !important;
  }
  /* Fix Safari Backdrop-Filter clipping bug */
  header#main-nav.luxury-nav .nav-links {
    background: transparent !important;
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    position: relative !important;
  }
  header#main-nav.luxury-nav .nav-links::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border-radius: 50px !important;
    background: rgba(13, 22, 45, 0.6) !important;
    backdrop-filter: blur(20px) !important;
    -webkit-backdrop-filter: blur(20px) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    z-index: -1 !important;
    pointer-events: none;
  }
  header#main-nav.luxury-nav .nav-wrapper {
    z-index: 9001 !important;
  }
  header#main-nav.luxury-nav .mega-menu {
    z-index: 9002 !important;
    overflow: visible !important;
  }
</style>
</head>
<body>
<div class="container">
  <div class="center"></div>
</div>
</body>
</html>
