<!DOCTYPE html>
<html dir="rtl">
<head>
<style>
.container {
  position: relative;
  width: 1000px;
  height: 100px;
  background: #ccc;
  margin: 0 auto;
}
.center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: red;
  width: 200px;
  height: 50px;
}
</style>
</head>
<body>
<div class="container">
  <div class="center"></div>
</div>
</body>
</html>
