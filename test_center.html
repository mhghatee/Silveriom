<!DOCTYPE html>
<html dir="rtl">
<head>
<style>
.container {
  position: relative;
  width: 1000px;
  height: 100px;
  background: #ccc;
  margin: 0 auto;
}
.center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: red;
  width: 200px;
  height: 50px;
}
</style>
<style>.top-complex-bar { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; z-index: 9999999 !important; display: flex !important; opacity: 1 !important; visibility: visible !important; margin: 0 !important; transform: none !important; } #silverium-loader { top: 50px !important; height: calc(100vh - 50px) !important; } @media (max-width: 1024px) { #silverium-loader { top: 40px !important; height: calc(100vh - 40px) !important; } }</style>

</head>
<body>
<div class="container">
  <div class="center"></div>
</div>
</body>
</html>
