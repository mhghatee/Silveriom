<!DOCTYPE html>
<html>
<style id="silveriom-megamenu-styles">
  .glass-panel-mega {
    background: #0a0f1a !important;
    backdrop-filter: blur(32px) !important;
    -webkit-backdrop-filter: blur(32px) !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    border-radius: 28px !important;
    box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1) !important;
  }
  .mega-menu {
    opacity: 0 !important;
    visibility: hidden !important;
    transform: translateY(15px) !important;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
    z-index: 99999 !important;
  }
  .nav-wrapper:hover .mega-menu {
    opacity: 1 !important;
    visibility: visible !important;
    transform: translateY(0) !important;
  }
  .nav-wrapper:hover .mega-caret {
    transform: rotate(180deg) !important;
  }
  .mega-item {
    transition: all 0.3s ease !important;
    cursor: pointer !important;
    text-decoration: none !important;
  }
  .mega-item:hover .mega-icon {
    color: #CCFF00 !important;
    transform: scale(1.1) !important;
  }
  .mega-item:hover .mega-title {
    color: #CCFF00 !important;
  }
  .mega-icon {
    transition: transform 0.3s ease !important;
  }
  .img-action-btn {
    background: rgba(255, 255, 255, 0.85) !important;
    backdrop-filter: blur(10px) !important;
    color: #000 !important;
    transition: all 0.3s ease !important;
  }
  .left-image-group:hover .img-action-btn {
    background: #CCFF00 !important;
    transform: scale(1.05) !important;
  }
  .mega-title {
    font-family: "YekanBakh", sans-serif !important;
  }
  @keyframes icon-pulse-glow {
    0% { filter: drop-shadow(0 0 5px rgba(204,255,0,0.5)) scale(1); }
    50% { filter: drop-shadow(0 0 18px rgba(204,255,0,1)) scale(1.15); }
    100% { filter: drop-shadow(0 0 5px rgba(204,255,0,0.5)) scale(1); }
  }
  .highlight-icon {
    animation: icon-pulse-glow 2.5s infinite ease-in-out !important;
  }
</style>
<style id="silveriom-nav-clip-fix">
  /* Remove backdrop and background from nav-links to avoid webkit border-radius clipping bug */
  .luxury-nav .nav-links {
    backdrop-filter: none !important;
    -webkit-backdrop-filter: none !important;
    background: transparent !important;
    border: none !important;
    position: relative !important;
  }
  
  /* Apply the glass effect to a pseudo-element behind the items */
  .luxury-nav .nav-links::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(13, 22, 45, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 50px;
    z-index: -1;
    pointer-events: none;
  }
  
  /* Ensure the dropdown renders above everything */
  .nav-dropdown-menu {
    z-index: 99999 !important;
  }
</style>

<!-- Dynamic Menu Activator -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const currentUrl = window.location.href.split('?')[0]; 
    const currentPath = window.location.pathname;
    const cleanCurrent = currentPath.replace(/\/index\.html$/, '').replace(/\/$/, '');

    document.querySelectorAll('.nav-links .nav-item, .mobile-nav .mobile-nav-card').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-dropdown-item').forEach(el => el.classList.remove('active'));
    
    let matched = false;

    document.querySelectorAll('.nav-dropdown-item').forEach(el => {
        const href = el.getAttribute('href');
        if (href) {
            let hrefPath = '';
            try { hrefPath = new URL(href).pathname; } catch(e) { hrefPath = href; }
            let cleanHref = hrefPath.replace(/\/index\.html$/, '').replace(/\/$/, '');
            if ((cleanHref.length > 0 && cleanCurrent === cleanHref) || (cleanHref.length > 0 && cleanCurrent.startsWith(cleanHref + '/'))) {
                el.classList.add('active');
                const parentDropdown = el.closest('.nav-dropdown');
                if (parentDropdown) {
                    const parentNav = parentDropdown.querySelector('.nav-item');
                    if (parentNav) {
                        parentNav.classList.add('active');
                        matched = true;
                    }
                }
            }
        }
    });

    document.querySelectorAll('.nav-item, .mobile-nav-card').forEach(el => {
        const href = el.getAttribute('href');
        if (href && href !== '#' && !href.endsWith('silveriom.ir') && !href.endsWith('silveriom.ir/')) {
            let hrefPath = '';
            try { hrefPath = new URL(href, window.location.origin).pathname; } catch(e) { hrefPath = href; }
            let cleanHref = hrefPath.replace(/\/index\.html$/, '').replace(/\/$/, '');
            if ((cleanHref.length > 0 && cleanCurrent === cleanHref) || (cleanHref.length > 0 && cleanCurrent.startsWith(cleanHref + '/'))) {
                el.classList.add('active');
                matched = true;
            }
        }
    });

    if (!matched || currentPath === '/' || currentPath === '/index.html') {
        document.querySelectorAll('.nav-item[href="https://silveriom.ir"], .nav-item[href="https://silveriom.ir/"], .mobile-nav-card[href="https://silveriom.ir"], .mobile-nav-card[href="https://silveriom.ir/"]').forEach(el => el.classList.add('active'));
    }
});
</script>
