<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مدیاکیت اختصاصی | سیلوریوم</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-neon: #B6FF00;
        }
        
        
        @font-face {
          font-family: YekanBakh;
          src: url(https://silveriom.ir/fonts/YekanBakhFaNum-Regular.woff2) format(woff2),
               url(https://silveriom.ir/fonts/YekanBakhFaNum-Regular.woff) format(woff);
          font-weight: 400;
        }
        @font-face {
          font-family: YekanBakh;
          src: url(https://silveriom.ir/fonts/YekanBakhFaNum-Bold.woff2) format(woff2),
               url(https://silveriom.ir/fonts/YekanBakhFaNum-Bold.woff) format(woff);
          font-weight: 700;
        }
        @font-face {
          font-family: YekanBakh;
          src: url(https://silveriom.ir/fonts/YekanBakhFaNum-ExtraBold.woff2) format(woff2);
          font-weight: 800;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'YekanBakh', 'Yekan Bakh', Tahoma, sans-serif !important;
        }</strong></div>
                    <div style="margin-top: 10px;">تاریخ ایجاد: <strong style="color: #fff;">${dateStr}</strong></div>
                </div>
            </div>
        `;
    }

    function renderProductCards(proposal, inventory) {
        const grid = document.getElementById('productGrid');
        let html = '';
        
        proposal.cart.forEach(code => {
            const media = inventory.find(m => m.code === code || m.id === code);
            if (media) {
                let image = media.image || 'assets/placeholder_media.jpg';
                if (!image.startsWith('/') && !image.startsWith('http') && !image.startsWith('../')) {
                    image = '/' + image;
                }
                
                const locIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>`;
                const dimsIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>`;
                const printIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>`;
                
                let rawLoc = media.location;
                let locDisplay = "";
                if(rawLoc === "t10") locDisplay = "T10 آجودانیه";
                else if(rawLoc === "arena") locDisplay = "آرنا آزادی";
                else if(rawLoc === "enghelab") locDisplay = "انقلاب";
                else if(rawLoc === "netra") locDisplay = "نترا لواسان";
                else if(rawLoc === "iranzamin") locDisplay = "ایران‌زمین شهرک غرب";
                else if(rawLoc === "asayesh") locDisplay = "آسایش ساری";
                else locDisplay = rawLoc;

                const statusClass = media.status === 'available' ? '' : 'reserved';
                const statusText = media.status === 'available' ? 'قابل رزرو' : 'رزرو شده';
                
                html += `
                <article class="media-showcase-card">
                    <div class="msc-img-wrapper">
                        <img src="${image}" alt="${media.title}" loading="lazy">
                        <span class="msc-code-badge">کد: ${media.code}</span>
                        <span class="msc-status-badge ${statusClass}">${statusText}</span>
                    </div>
                    
                    <div class="msc-location" style="display: flex; align-items: center; gap: 6px;">${locIcon} <span>${locDisplay}</span></div>
                    <h3 class="msc-title">${media.title}</h3>
                    
                    <div class="msc-tariff-box">
                        <span class="msc-tariff-label">تعرفه ماهانه:</span>
                        <span class="msc-tariff-value">${media.tariff || 'توافقی'}</span>
                    </div>
                    
                    <div class="msc-specs-grid" style="grid-template-columns: 1fr 1fr;">
                        <div style="display: flex; align-items: center; gap: 6px;">${dimsIcon} <span>ابعاد: <strong>${media.dimensions || '---'}</strong></span></div>
                        <div style="display: flex; align-items: center; gap: 6px;">${printIcon} <span>چاپ: <strong>${media.print_type || '---'}</strong></span></div>
                    </div>
                </article>
                `;
            }
        });
        
        grid.innerHTML = html;
        document.getElementById('actions').style.display = 'flex';
    }

    function setupActions(proposal) {
        const link = window.location.href;
        const text = `سلام، مدیاکیت رسانه‌ای برند ${proposal.brand} در پلتفرم سیلوریوم با شناسه ${proposal.id} آماده است. جهت مشاهده روی لینک کلیک کنید:\n\n${link}`;
        document.getElementById('waBtn').href = `https://wa.me/?text=${encodeURIComponent(text)}`;
    }

    function copyLink() {
        navigator.clipboard.writeText(window.location.href).then(() => {
            alert('لینک کپی شد!');
        });
    }

    function downloadPDF() {
        const actionsBar = document.getElementById('actions');
        actionsBar.style.display = 'none';
        document.body.classList.add('pdf-mode');

        // Render donuts to Canvas for html2canvas support (conic-gradient is not supported)
        document.querySelectorAll('.donut-chart').forEach(donut => {
            if (donut.querySelector('canvas')) return;
            const perc = parseFloat(donut.style.getPropertyValue('--perc')) || 0;
            const color1 = donut.style.getPropertyValue('--color1').trim() || '#CCFF00';
            const color2 = donut.style.getPropertyValue('--color2').trim() || '#1e293b';
            
            const canvas = document.createElement('canvas');
            canvas.width = 160;
            canvas.height = 160;
            const ctx = canvas.getContext('2d');
            
            ctx.beginPath();
            ctx.arc(80, 80, 65, 0, 2 * Math.PI);
            ctx.strokeStyle = color2;
            ctx.lineWidth = 14;
            ctx.stroke();
            
            ctx.beginPath();
            const startAngle = -Math.PI / 2;
            const endAngle = startAngle + (perc / 100) * 2 * Math.PI;
            ctx.arc(80, 80, 65, startAngle, endAngle);
            ctx.strokeStyle = color1;
            ctx.lineWidth = 14;
            ctx.stroke();
            
            canvas.style.position = 'absolute';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.zIndex = '0';
            
            donut.style.background = 'none';
            if (donut.style.mask !== undefined) donut.style.mask = 'none';
            if (donut.style.webkitMask !== undefined) donut.style.webkitMask = 'none';
            donut.insertBefore(canvas, donut.firstChild);
        });
        
        // Capture the entire body to include the background
        const element = document.body;
        const pid = (proposalData && proposalData.id) ? proposalData.id : 'mediakit';
        const filename = `Silveriom_MediaKit_${pid}.pdf`;

        // Measure actual content size for a single-page PDF with no breaks
        const contentWidth  = document.getElementById('app-container').scrollWidth;
        const contentHeight = document.getElementById('app-container').scrollHeight + 100; // add some padding
        const pxToMm = 0.264583;
        const widthMm  = contentWidth  * pxToMm;
        const heightMm = contentHeight * pxToMm;

        const opt = {
          margin: 0,
          filename: filename,
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: {
              scale: 1.5,
              useCORS: true,
              windowWidth: contentWidth,
              backgroundColor: '#020617',
              scrollX: 0,
              scrollY: 0,
              width: contentWidth,
              height: contentHeight,
              allowTaint: true
          },
          jsPDF: {
              unit: 'mm',
              format: [widthMm, heightMm],
              orientation: 'portrait'
          },
          pagebreak: { mode: 'avoid-all' }
        };

        // Wait a moment for the background image to load before capturing
        setTimeout(() => {
            html2pdf().set(opt).from(element).save().then(() => {
                actionsBar.style.display = 'flex';
                document.body.classList.remove('pdf-mode');
            }).catch(err => {
                console.error('PDF error:', err);
                actionsBar.style.display = 'flex';
                document.body.classList.remove('pdf-mode');
                alert('خطا در تولید PDF. لطفاً مجدداً امتحان کنید.');
            });
        }, 200);
    }

    window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
